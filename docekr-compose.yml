services:
  mysql-seervice:
    image: mysql:8
    
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}

    networks:
     - app-network
  app-service:
    build: .
    container_name: task_backend
    restart: unless-stopped
    ports:
      - "5000:5000"

    env_file:
      - .env

    depends_on:
      - mysql-service
    networks:
    - app-network
volumes:
  mysql_data
networks:
  app-network:


